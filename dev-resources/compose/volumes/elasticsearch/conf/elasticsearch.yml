---
## Single node Elasticsearch configuration for local development and CI testing.
## See https://www.elastic.co/docs/reference/elasticsearch/configuration-reference
#
cluster.name: "docker-cluster"
network.host: 0.0.0.0

## Use single node discovery in order to disable production mode and avoid bootstrap checks
## see https://www.elastic.co/docs/deploy-manage/deploy/self-managed/bootstrap-checks
#
discovery.type: single-node

## Disable security so stroom can connect over plain HTTP without credentials.
## NOT suitable for a production deployment.
#
xpack.security.enabled: false

## Disable features stroom does not use, to reduce start-up time and memory use
#
xpack.ml.enabled: false
xpack.watcher.enabled: false

## Don't make indices read-only when the docker host's disk is nearly full
#
cluster.routing.allocation.disk.threshold_enabled: false
