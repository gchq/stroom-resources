services:
  stroom-proxy-local:
    container_name: "${CONTAINER_NAME_PREFIX}stroom-proxy-local"
    image: "${STROOM_PROXY_DOCKER_REPO:-gchq/stroom-proxy}:${STROOM_PROXY_TAG:-v7-LATEST}"
    environment:
      - DOWNSTREAM_HOST_SCHEME=${STROOM_PROXY_LOCAL_DOWNSTREAM_HOST_SCHEME:-http}
      - DOWNSTREAM_HOST_PORT=${STROOM_PROXY_LOCAL_DOWNSTREAM_HOST_PORT:-8080}
      - DOWNSTREAM_HOST_HOSTNAME=${STROOM_PROXY_LOCAL_DOWNSTREAM_HOST_HOSTNAME:-stroom}
      - DOWNSTREAM_API_KEY=${STROOM_PROXY_LOCAL_DOWNSTREAM_API_KEY:-}
      - DOCKER_HOST_HOSTNAME=${DOCKER_HOST_HOSTNAME:-UNKNOWN}
      - DOCKER_HOST_IP=${DOCKER_HOST_IP:-UNKNOWN}
      - FORWARDING_ENABLED=${STROOM_PROXY_LOCAL_FORWARDING_ENABLED:-true}
      - FORWARD_URL=${STROOM_PROXY_LOCAL_FORWARD_URL:-}
      - JAVA_OPTS=${STROOM_PROXY_LOCAL_JAVA_OPTS:- -Xms50m -Xmx2g}
      # FEED_STATUS_URL is normally derived using the downstream host config
      - FEED_STATUS_URL=${STROOM_PROXY_LOCAL_FEED_STATUS_URL:-}
      - REST_CLIENT_VERIFY_HOSTNAME=${STROOM_PROXY_LOCAL_REST_CLIENT_VERIFY_HOSTNAME:-true}
      - IDENTITY_PROVIDER_TYPE=${STROOM_PROXY_LOCAL_IDENTITY_PROVIDER_TYPE:-NO_IDP}
      - RECEIVE_AUTH_REQUIRED=${STROOM_PROXY_LOCAL_RECEIVE_AUTH_REQUIRED:-true}
    # In the container, all the directories are 1000:0. We need to run as the current host user but GID 0.
    # This means we can access container dirs via GID 0, but bind mounted host files using the host user's UID.
    user: "${DOCKER_HOST_UID:-1000}:0"
    ports:
      # Allow the ports on the docker host to be chaned, internally they are fixed
      - "${STROOM_PROXY_LOCAL_APP_PORT:-8090}:8090"
      - "${STROOM_PROXY_LOCAL_ADMIN_PORT:-8091}:8091"
      #- "${STROOM_PROXY_LOCAL_DEBUG_PORT:-10766}:10766"
    healthcheck:
      test: curl --connect-timeout 5 --max-time 10 --fail --silent --head --output /dev/null http://localhost:8091/proxyAdmin/healthcheck || exit 1
      start_period: 30s
      interval: 1m
      timeout: 5s
      retries: 3
    volumes:
      - ${STROOM_PROXY_LOCAL_VOLUME_CERTS:-../volumes/stroom-proxy-local/certs}:/stroom-proxy/certs:ro
      - ${STROOM_PROXY_LOCAL_VOLUME_CONFIG:-../volumes/stroom-proxy-local/config}:/stroom-proxy/config:ro
      #- type: tmpfs
        #target: /tmp
        #tmpfs:
          ##size: "${STROOM_PROXY_LOCAL_TEMP_MOUNT_SIZE:-g}"
          #mode: 0o01777
      - type: volume
        source: stroom-proxy-local_content
        target: /stroom-proxy/content
      - type: volume
        source: stroom-proxy-local_logs
        target: /stroom-proxy/logs
      - type: volume
        source: stroom-proxy-local_data_feed_identities
        target: /stroom-proxy/data_feed_identities
      - type: volume
        source: stroom-proxy-local_data
        target: /stroom-proxy/data
      - type: volume
        source: stroom-proxy-local_failures
        target: /stroom-proxy/failures
      - type: volume
        source: stroom-proxy-local_zip_file_ingest
        target: /stroom-proxy/zip_file_ingest
      - type: volume
        source: stroom-proxy-local_zip_file_ingest_failed
        target: /stroom-proxy/zip_file_ingest_failed
    tmpfs:
        # uid=1000,gid=0 to match the uid:gid defaulted in the dockerfiles
      - "/tmp:noatime,noexec,mode=1777,uid=1000,gid=0,size=${STROOM_PROXY_LOCAL_TMP_VOL_MAX_SIZE:-64g}"
    logging:
      driver: "json-file"
      options:
        max-size: "${STROOM_PROXY_LOCAL_STD_OUT_LOGS_MAX_SIZE:-10m}"
        max-file: "${STROOM_PROXY_LOCAL_STD_OUT_LOGS_MAX_FILES:-2}"
    labels:
      - "stack_name=${STACK_NAME:-<STACK_NAME>}"
volumes:
  stroom-proxy-local_data_feed_identities:
  stroom-proxy-local_content:
  stroom-proxy-local_logs:
  stroom-proxy-local_data:
  stroom-proxy-local_failures:
  stroom-proxy-local_zip_file_ingest:
  stroom-proxy-local_zip_file_ingest_failed:
